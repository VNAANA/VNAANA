[tool.ruff]
target-version = "py312"
line-length = 88
src = ["Backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90"]
# C90 enforces McCabe cyclomatic complexity.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Ruff's formatter is intentionally used for Python only.
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["Backend"]
omit = [
    "Backend/tests/*",
    "Backend/*/tests/*",
    "Backend/*/migrations/*",
    "Backend/Testing_ENV/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
