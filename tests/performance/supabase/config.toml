
# Dedicated local Supabase project for frontend performance tests.
# Never share this project with tests/e2e.

project_id = "vnaana-performance"

[api]
enabled = true
port = 55541
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55542
shadow_port = 55540
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[local_smtp]
enabled = false

[auth.email]
enabled = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
