name: CI

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Unit Tests
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements.txt

            - name: Compile Python files
              run: python -m compileall -q Backend

            - name: Run unit tests
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
              run: python -m pytest -c Backend/pytest.ini Backend/tests/unit -v

            - name: Check architectural boundaries
              run: lint-imports

    publish:
        name: Build and Publish Docker Image
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set lowercase image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    deploy:
        name: Deploy to Azure
        runs-on: ubuntu-latest
        needs: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Log in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy image to Azure Container Apps and Job
              uses: azure/CLI@v1
              with:
                  inlineScript: |
                      set -e

                      IMAGE="ghcr.io/vnaana/vnaana:sha-${GITHUB_SHA}"

                      echo "Deploying image: $IMAGE"

                      echo "Updating API Container App..."
                      az containerapp update \
                        --name vna-api \
                        --resource-group rb-vna-dev \
                        --image "$IMAGE"

                      echo "Updating scheduled news pipeline Job..."
                      az containerapp job update \
                        --name news-pipeline-job \
                        --resource-group rb-vna-dev \
                        --image "$IMAGE"

                      echo "Both Azure resources updated successfully."
