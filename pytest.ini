[pytest]
# This file lives in the VNAANA root, so `import Backend...` and
# `import tests...` both work without extra setup.
pythonpath = .
testpaths = tests

# manual/ holds scripts that need a real database or Ollama. They are run by
# hand with `python -m`, never collected as tests.
norecursedirs = manual .* __pycache__ node_modules venv .venv
